services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        image: timer-v34-app:latest
        container_name: timer-v34-app
        restart: always
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        env_file:
            - path: .env
              required: false
        environment:
            APP_NAME: ${APP_NAME:-Laravel}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            LOG_STACK: ${LOG_STACK:-stderr}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            CACHE_STORE: ${CACHE_STORE:-redis}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
            SESSION_DRIVER: ${SESSION_DRIVER:-database}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST:-postgres}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
            DB_USERNAME: ${DB_USERNAME:-timer_user}
            DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-360}
            FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
            FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
            FRESHDESK_WEBHOOK_USER: ${FRESHDESK_WEBHOOK_USER:-admin}
            FRESHDESK_WEBHOOK_PASSWORD: ${FRESHDESK_WEBHOOK_PASSWORD:-}
            FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
            ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-false}
            GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
            ROCKETCHAT_URL: ${ROCKETCHAT_URL:-http://host.docker.internal:3000}
            ROCKETCHAT_USER_ID: ${ROCKETCHAT_USER_ID:-}
            ROCKETCHAT_TOKEN: ${ROCKETCHAT_TOKEN:-}
            ROCKETCHAT_CHANNEL: ${ROCKETCHAT_CHANNEL:-GENERAL}
            ROCKETCHAT_WEBHOOK_URL: ${ROCKETCHAT_WEBHOOK_URL:-}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            - postgres
            - redis

    webserver:
        build:
            context: .
            dockerfile: Dockerfile
            target: webserver
        image: timer-v34-webserver:latest
        container_name: timer-v34-webserver
        restart: always
        security_opt:
            - no-new-privileges:true
        ports:
            - "${APP_PORT:-8340}:80"
        volumes:
            - laravel-v34-storage:/var/www/html/storage:ro
        networks:
            - timer-v34-network
        depends_on:
            - app

    queue-worker:
        image: timer-v34-app:latest
        container_name: timer-v34-queue-worker
        restart: always
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        user: www-data
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=ticket-logic,freshdesk-outbound,default
            - --sleep=1
            - --tries=4
            - --backoff=15,30,60
            - --timeout=105
            - --max-time=3600
        env_file:
            - path: .env
              required: false
        environment:
            APP_NAME: ${APP_NAME:-Laravel}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            LOG_STACK: ${LOG_STACK:-stderr}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            CACHE_STORE: ${CACHE_STORE:-redis}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
            SESSION_DRIVER: ${SESSION_DRIVER:-database}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST:-postgres}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
            DB_USERNAME: ${DB_USERNAME:-timer_user}
            DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-360}
            FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
            FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
            FRESHDESK_WEBHOOK_USER: ${FRESHDESK_WEBHOOK_USER:-admin}
            FRESHDESK_WEBHOOK_PASSWORD: ${FRESHDESK_WEBHOOK_PASSWORD:-}
            FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
            ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-false}
            GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
            ROCKETCHAT_URL: ${ROCKETCHAT_URL:-http://host.docker.internal:3000}
            ROCKETCHAT_USER_ID: ${ROCKETCHAT_USER_ID:-}
            ROCKETCHAT_TOKEN: ${ROCKETCHAT_TOKEN:-}
            ROCKETCHAT_CHANNEL: ${ROCKETCHAT_CHANNEL:-GENERAL}
            ROCKETCHAT_WEBHOOK_URL: ${ROCKETCHAT_WEBHOOK_URL:-}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            - postgres
            - redis

    freshdesk-ingest-worker:
        image: timer-v34-app:latest
        container_name: timer-v34-freshdesk-ingest-worker
        restart: always
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        user: www-data
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=freshdesk-ingest
            - --sleep=1
            - --tries=1
            - --timeout=120
            - --max-time=3600
        env_file:
            - path: .env
              required: false
        environment: &worker-environment
            APP_NAME: ${APP_NAME:-Laravel}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            CACHE_STORE: ${CACHE_STORE:-redis}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST:-postgres}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
            DB_USERNAME: ${DB_USERNAME:-timer_user}
            DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-360}
            FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
            FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
            FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
            ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-false}
            GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
            FRESHDESK_SPOOL_ENABLED: ${FRESHDESK_SPOOL_ENABLED:-true}
            FRESHDESK_REQUIRE_DIRECTORY_FSYNC: ${FRESHDESK_REQUIRE_DIRECTORY_FSYNC:-true}
            ROCKETCHAT_URL: ${ROCKETCHAT_URL:-http://host.docker.internal:3000}
            ROCKETCHAT_USER_ID: ${ROCKETCHAT_USER_ID:-}
            ROCKETCHAT_TOKEN: ${ROCKETCHAT_TOKEN:-}
            ROCKETCHAT_CHANNEL: ${ROCKETCHAT_CHANNEL:-GENERAL}
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            - postgres
            - redis

    durable-scheduler:
        image: timer-v34-app:latest
        container_name: timer-v34-durable-scheduler
        restart: always
        security_opt:
            - no-new-privileges:true
        working_dir: /var/www/html
        user: www-data
        command: ["php", "artisan", "schedule:work"]
        env_file:
            - path: .env
              required: false
        environment: *worker-environment
        volumes:
            - laravel-v34-storage:/var/www/html/storage
        networks:
            - timer-v34-network
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:16-alpine
        container_name: timer-v34-postgres
        restart: always
        security_opt:
            - no-new-privileges:true
        environment:
            POSTGRES_DB: ${DB_DATABASE:-timer_v34_db}
            POSTGRES_USER: ${DB_USERNAME:-timer_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-timer_password_123}
        ports:
            - "127.0.0.1:${FORWARD_DB_PORT:-5434}:5432"
        volumes:
            - postgres-v34-data:/var/lib/postgresql/data
        networks:
            - timer-v34-network

    redis:
        image: redis:7-alpine
        container_name: timer-v34-redis
        restart: always
        security_opt:
            - no-new-privileges:true
        command:
            ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
        ports:
            - "127.0.0.1:${FORWARD_REDIS_PORT:-6384}:6379"
        volumes:
            - redis-v34-data:/data
        networks:
            - timer-v34-network

networks:
    timer-v34-network:
        driver: bridge

volumes:
    laravel-v34-storage:
        driver: local
    postgres-v34-data:
        driver: local
    redis-v34-data:
        driver: local

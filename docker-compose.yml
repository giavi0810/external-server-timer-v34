version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: timer-v34-app:latest
    container_name: timer-v34-app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - timer-v34-network
    depends_on:
      - postgres
      - redis

  webserver:
    image: nginx:alpine
    container_name: timer-v34-webserver
    restart: always
    ports:
      - "8340:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - timer-v34-network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: timer-v34-postgres
    restart: always
    environment:
      POSTGRES_DB: timer_v34_db
      POSTGRES_USER: timer_user
      POSTGRES_PASSWORD: timer_password_123
    ports:
      - "5434:5432"
    volumes:
      - postgres-v34-data:/var/lib/postgresql/data
    networks:
      - timer-v34-network

  redis:
    image: redis:7-alpine
    container_name: timer-v34-redis
    restart: always
    ports:
      - "6384:6379"
    volumes:
      - redis-v34-data:/data
    networks:
      - timer-v34-network

networks:
  timer-v34-network:
    driver: bridge

volumes:
  postgres-v34-data:
    driver: local
  redis-v34-data:
    driver: local

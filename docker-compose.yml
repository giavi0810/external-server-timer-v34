services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: timer-v34-app:latest
    container_name: timer-v34-app
    restart: always
    security_opt:
      - no-new-privileges:true
    working_dir: /var/www/html
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_STACK: ${LOG_STACK:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
      DB_USERNAME: ${DB_USERNAME:-timer_user}
      DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
      FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
      FRESHDESK_WEBHOOK_USER: ${FRESHDESK_WEBHOOK_USER:-admin}
      FRESHDESK_WEBHOOK_PASSWORD: ${FRESHDESK_WEBHOOK_PASSWORD:-}
      FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
      ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-false}
      GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
    volumes:
      - laravel-v34-storage:/var/www/html/storage
    networks:
      - timer-v34-network
    depends_on:
      - postgres
      - redis

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: webserver
    image: timer-v34-webserver:latest
    container_name: timer-v34-webserver
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "${APP_PORT:-8340}:80"
    volumes:
      - laravel-v34-storage:/var/www/html/storage:ro
    networks:
      - timer-v34-network
    depends_on:
      - app

  queue-worker:
    image: timer-v34-app:latest
    container_name: timer-v34-queue-worker
    restart: always
    security_opt:
      - no-new-privileges:true
    working_dir: /var/www/html
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=default
      - --sleep=1
      - --tries=4
      - --backoff=15,30,60
      - --timeout=105
      - --max-time=3600
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_STACK: ${LOG_STACK:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
      DB_USERNAME: ${DB_USERNAME:-timer_user}
      DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FRESHDESK_DOMAIN: ${FRESHDESK_DOMAIN:-}
      FRESHDESK_API_KEY: ${FRESHDESK_API_KEY:-}
      FRESHDESK_WEBHOOK_USER: ${FRESHDESK_WEBHOOK_USER:-admin}
      FRESHDESK_WEBHOOK_PASSWORD: ${FRESHDESK_WEBHOOK_PASSWORD:-}
      FRESHDESK_REOPEN_THRESHOLD: ${FRESHDESK_REOPEN_THRESHOLD:-1440}
      ENABLE_LEGACY_TICKET_FILTER: ${ENABLE_LEGACY_TICKET_FILTER:-false}
      GO_LIVE_TIMESTAMP: ${GO_LIVE_TIMESTAMP:-}
    volumes:
      - laravel-v34-storage:/var/www/html/storage
    networks:
      - timer-v34-network
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: timer-v34-postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_DATABASE:-timer_v34_db}
      POSTGRES_USER: ${DB_USERNAME:-timer_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-timer_password_123}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5434}:5432"
    volumes:
      - postgres-v34-data:/var/lib/postgresql/data
    networks:
      - timer-v34-network

  redis:
    image: redis:7-alpine
    container_name: timer-v34-redis
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6384}:6379"
    volumes:
      - redis-v34-data:/data
    networks:
      - timer-v34-network

networks:
  timer-v34-network:
    driver: bridge

volumes:
  laravel-v34-storage:
    driver: local
  postgres-v34-data:
    driver: local
  redis-v34-data:
    driver: local

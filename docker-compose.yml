services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: timer-v34-app:latest
    container_name: timer-v34-app
    restart: always
    working_dir: /var/www/html
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-timer_v34_db}
      DB_USERNAME: ${DB_USERNAME:-timer_user}
      DB_PASSWORD: ${DB_PASSWORD:-timer_password_123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - laravel-v34-storage:/var/www/html/storage
    networks:
      - timer-v34-network
    depends_on:
      - postgres
      - redis

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: webserver
    image: timer-v34-webserver:latest
    container_name: timer-v34-webserver
    restart: always
    ports:
      - "${APP_PORT:-8340}:80"
    volumes:
      - laravel-v34-storage:/var/www/html/storage:ro
    networks:
      - timer-v34-network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: timer-v34-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-timer_v34_db}
      POSTGRES_USER: ${DB_USERNAME:-timer_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-timer_password_123}
    ports:
      - "${FORWARD_DB_PORT:-5434}:5432"
    volumes:
      - postgres-v34-data:/var/lib/postgresql/data
    networks:
      - timer-v34-network

  redis:
    image: redis:7-alpine
    container_name: timer-v34-redis
    restart: always
    ports:
      - "${FORWARD_REDIS_PORT:-6384}:6379"
    volumes:
      - redis-v34-data:/data
    networks:
      - timer-v34-network

networks:
  timer-v34-network:
    driver: bridge

volumes:
  laravel-v34-storage:
    driver: local
  postgres-v34-data:
    driver: local
  redis-v34-data:
    driver: local
